# Build MiniCA (server + mcacli) for Linux, macOS and Windows on x86_64 and
# aarch64, and FreeBSD on x86_64. Every push and PR runs tests and builds all targets.
# A push to main whose Cargo.toml version has no matching v<version> tag yet
# also publishes a GitHub Release with the archives and pushes the container
# image to docker.io/wushilin/minica:<version> and ghcr.io/wushilin/minica:<version>
# (and :latest on both), so bumping the version is all it takes to cut a
# release. The image is smoke-tested on every
# run (docker/test.sh) on both amd64 and arm64.
#
# A manual run with publish_docker=true pushes the image for the current
# version even when its tag already exists (e.g. to publish an older release).
#
# Pushing to Docker Hub needs the repository secret DOCKERHUB_TOKEN: a Docker
# Hub access token for the wushilin account with Read & Write scope. GHCR uses
# the workflow's GITHUB_TOKEN.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_docker:
        description: Push the Docker image for the current Cargo.toml version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      docker: ${{ steps.v.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] &&
             ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          docker=$release
          if [[ "${{ inputs.publish_docker }}" == true ]]; then
            docker=true
          fi
          echo "docker=$docker" >> "$GITHUB_OUTPUT"
          echo "version $version, release $release, docker $docker"

  test:
    runs-on: ubuntu-latest
    # The truststore tests need openssl >= 3.2 (pkcs12 -jdktrust); the runner's
    # Ubuntu 24.04 ships 3.0, Debian trixie ships 3.5.
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends openssl
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - run: cargo test --locked
      - run: go vet ./... && go test ./...
        working-directory: cli

  build:
    needs: version
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest,     target: x86_64-unknown-linux-musl,  goos: linux,   goarch: amd64 }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm,  target: aarch64-unknown-linux-musl, goos: linux,   goarch: arm64 }
          - { name: macos-x86_64,   os: macos-latest,      target: x86_64-apple-darwin,        goos: darwin,  goarch: amd64 }
          - { name: macos-aarch64,  os: macos-latest,      target: aarch64-apple-darwin,       goos: darwin,  goarch: arm64 }
          - { name: windows-x86_64, os: windows-latest,    target: x86_64-pc-windows-msvc,     goos: windows, goarch: amd64, exe: .exe }
          - { name: windows-aarch64, os: windows-latest,   target: aarch64-pc-windows-msvc,    goos: windows, goarch: arm64, exe: .exe }
          - { name: freebsd-x86_64, os: ubuntu-latest,     target: x86_64-unknown-freebsd,     goos: freebsd, goarch: amd64, freebsd: amd64 }
    env:
      STAGE: minica-${{ needs.version.outputs.version }}-${{ matrix.name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The CLI is pure Go, so it cross-compiles from any host.
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.mod
      - name: Build mcacli
        working-directory: cli
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o "../$STAGE/mcacli${{ matrix.exe }}" .

      - name: Install Rust
        if: ${{ !matrix.freebsd }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.freebsd }}
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build minica
        if: ${{ !matrix.freebsd }}
        run: |
          if [[ "${{ matrix.target }}" == *linux-musl ]]; then
            export CC_$(echo "${{ matrix.target }}" | tr - _)=musl-gcc
          fi
          cargo build --locked --release --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/minica${{ matrix.exe }}" "$STAGE/"

      # FreeBSD builds natively in a VM, using the rust package from pkg.
      - name: Build minica (FreeBSD VM)
        if: ${{ matrix.freebsd }}
        uses: vmactions/freebsd-vm@v1
        with:
          arch: ${{ matrix.freebsd }}
          usesh: true
          prepare: |
            sed -i '' 's/quarterly/latest/' /etc/pkg/FreeBSD.conf
            pkg install -y rust
          run: |
            set -e
            cargo build --locked --release
            cp target/release/minica "$STAGE/"
          envs: STAGE

      - name: Package
        run: |
          cp README.md config.yaml.example "$STAGE/"
          mkdir -p dist
          if [[ -n "${{ matrix.exe }}" ]]; then
            7z a "dist/$STAGE.zip" "$STAGE" >/dev/null
          else
            chmod +x "$STAGE/minica" "$STAGE/mcacli"
            tar -czf "dist/$STAGE.tar.gz" "$STAGE"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAGE }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, test, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes

  # Build the image from the CI-built musl binaries on a native runner per
  # architecture and smoke-test it; on release, also push it as
  # <version>-<arch> for the manifest job below.
  docker:
    needs: [version, test, build]
    name: docker ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-latest,    name: linux-x86_64,  target: x86_64-unknown-linux-musl }
          - { arch: arm64, os: ubuntu-24.04-arm, name: linux-aarch64, target: aarch64-unknown-linux-musl }
    env:
      IMAGES: docker.io/wushilin/minica ghcr.io/wushilin/minica
      VERSION: ${{ needs.version.outputs.version }}
      STAGE: minica-${{ needs.version.outputs.version }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STAGE }}
          path: dist
      - name: Stage server binary
        run: |
          mkdir -p "target/${{ matrix.target }}/release"
          tar -xzf "dist/$STAGE.tar.gz" -C dist
          install -m 0755 "dist/$STAGE/minica" "target/${{ matrix.target }}/release/minica"
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.mod
      - name: Build image
        run: |
          docker build -f docker/Dockerfile \
            --platform linux/${{ matrix.arch }} \
            --build-arg RUST_TARGET=${{ matrix.target }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t minica:test .
      - name: Smoke test
        env:
          MINICA_CONTAINER_ENGINE: docker
          MINICA_TEST_IMAGE: minica:test
        run: docker/test.sh
      - uses: docker/login-action@v3
        if: needs.version.outputs.docker == 'true'
        with:
          username: wushilin
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: needs.version.outputs.docker == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push ${{ matrix.arch }} image
        if: needs.version.outputs.docker == 'true'
        run: |
          for image in $IMAGES; do
            docker tag minica:test "$image:$VERSION-${{ matrix.arch }}"
            docker push "$image:$VERSION-${{ matrix.arch }}"
          done

  # Combine the per-arch images into one multi-arch tag once the GitHub
  # Release is out (release is skipped on a manual publish_docker run).
  docker-manifest:
    needs: [version, docker, release]
    if: >-
      always() && needs.version.outputs.docker == 'true' &&
      needs.docker.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.release.result)
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      IMAGES: docker.io/wushilin/minica ghcr.io/wushilin/minica
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: wushilin
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish multi-arch manifests
        run: |
          for image in $IMAGES; do
            docker buildx imagetools create \
              -t "$image:$VERSION" -t "$image:latest" \
              "$image:$VERSION-amd64" "$image:$VERSION-arm64"
            docker buildx imagetools inspect "$image:$VERSION"
          done
